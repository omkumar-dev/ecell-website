<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register | E-Cell MIT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div th:replace="~{fragments :: navbar}"></div>

    <section class="py-20 max-w-2xl mx-auto px-4">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl border-t-8 border-blue-600">
            <h2 class="text-3xl font-bold text-center mb-8">Join the Innovation Hub</h2>
            
            <p th:if="${message}" class="bg-green-100 text-green-700 p-4 rounded-xl text-center mb-6 font-bold" th:text="${message}"></p>

            <form th:action="@{/register}" method="POST" class="space-y-6">
                <input type="text" name="fullName" placeholder="Full Name" required class="w-full px-5 py-3 bg-gray-50 rounded-xl border outline-none focus:ring-2 focus:ring-blue-600">
                <input type="email" name="email" placeholder="Email Address" required class="w-full px-5 py-3 bg-gray-50 rounded-xl border outline-none focus:ring-2 focus:ring-blue-600">
                <select name="event" class="w-full px-5 py-3 bg-gray-50 rounded-xl border outline-none focus:ring-2 focus:ring-blue-600">
                    <option value="Agri Startup">Agri Start UP Today</option>
                    <option value="Workshop">Startup Workshop</option>
                    <option value="General Hub">General Membership</option>
                </select>
                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition shadow-lg">Submit Registration</button>
            </form>
        </div>
    </section>

    <div th:replace="~{fragments :: footer}"></div>
</body>
</html>
