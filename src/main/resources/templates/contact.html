
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us | Agri Start UP Today</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <section class="py-20 max-w-3xl mx-auto px-4">
        <div class="bg-white p-10 rounded-3xl shadow-2xl border-2 border-green-800">
            <h2 class="text-3xl font-bold text-center mb-8">Join the Agri Hub</h2>
            <p th:if="${message}" class="text-green-600 font-bold text-center mb-4" th:text="${message}"></p>

            <form action="/register" method="POST" class="space-y-6">
                <input type="text" name="fullName" placeholder="Full Name" required class="w-full px-5 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-green-600">
                <input type="email" name="email" placeholder="Email Address" required class="w-full px-5 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-green-600">
                <select name="event" class="w-full px-5 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-green-600">
                    <option value="Idea Pitch">Idea Pitching</option>
                    <option value="Hackathon">Agri Hackathon</option>
                </select>
                <button type="submit" class="w-full bg-yellow-400 text-green-900 py-4 rounded-xl font-black text-lg hover:bg-yellow-500 transition shadow-lg">SEND REGISTRATION</button>
            </form>
        </div>
    </section>
</body>
</html>
