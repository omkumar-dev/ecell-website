<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | E-Cell MIT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">

    <div th:replace="~{fragments :: navbar}"></div>

    <div class="max-w-7xl mx-auto py-12 px-4">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div>
                <h1 class="text-3xl font-black text-blue-800 uppercase tracking-tighter">Live Registrations</h1>
                <p class="text-gray-500 font-bold italic">Manage participants for Hack Heist 2.0 & Agri Summit</p>
            </div>
            
            <a th:href="@{/dashboard/download}" 
               class="bg-green-600 text-white px-8 py-4 rounded-2xl font-black text-sm hover:bg-green-700 transition shadow-xl flex items-center gap-3 transform active:scale-95">
                <i class="fas fa-file-csv text-2xl"></i> DOWNLOAD EXCEL (CSV)
            </a>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-gray-100">
            <table class="w-full text-left border-collapse">
                <thead class="bg-blue-600 text-white">
                    <tr>
                        <th class="p-6 uppercase text-xs tracking-widest font-black">ID</th>
                        <th class="p-6 uppercase text-xs tracking-widest font-black">Full Name</th>
                        <th class="p-6 uppercase text-xs tracking-widest font-black">Email Address</th>
                        <th class="p-6 uppercase text-xs tracking-widest font-black">Selected Event</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(registrations)}">
                        <td colspan="4" class="p-20 text-center text-gray-400 italic">
                            <i class="fas fa-database text-5xl mb-4 block"></i>
                            No registrations found yet.
                        </td>
                    </tr>
                    
                    <tr th:each="reg : ${registrations}" class="border-b border-gray-50 hover:bg-blue-50/50 transition duration-300">
                        <td class="p-6 font-black text-blue-600" th:text="${'#' + reg.id}"></td>
                        <td class="p-6 font-bold text-gray-800" th:text="${reg.fullName}"></td>
                        <td class="p-6 text-gray-600" th:text="${reg.email}"></td>
                        <td class="p-6">
                            <span class="bg-blue-100 text-blue-700 px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-tighter" 
                                  th:text="${reg.event}">
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-8 text-center text-gray-400 text-sm italic">
            <p>E-Cell MIT Internal Dashboard &copy; 2026</p>
        </div>
    </div>

</body>
</html>
