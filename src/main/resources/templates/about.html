<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>About Us | E-Cell MIT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div th:replace="~{fragments :: navbar}"></div>

    <section class="py-20 max-w-5xl mx-auto px-4">
        <h2 class="text-4xl font-extrabold text-blue-600 mb-8">About E-Cell MIT</h2>
        <div class="grid md:grid-cols-2 gap-12">
            <div class="bg-white p-8 rounded-3xl shadow-lg border-l-8 border-blue-600">
                <h3 class="text-2xl font-bold mb-4">Our Vision</h3>
                <p class="text-gray-600">MIT Meerut mein ek aisa ecosystem banana jahan har student apne idea ko ek viable business mein badal sake.</p>
            </div>
            <div class="bg-white p-8 rounded-3xl shadow-lg border-l-8 border-green-600">
                <h3 class="text-2xl font-bold mb-4 italic text-green-700 uppercase text-sm tracking-widest">Active Focus</h3>
                <h4 class="text-xl font-black mb-2">Agri Start UP Today</h4>
                <p class="text-gray-600">Kheti-kisani mein technology aur innovation laakar Indian agriculture ko upgrade karna.</p>
            </div>
        </div>
    </section>

    <div th:replace="~{fragments :: footer}"></div>
</body>
</html>
