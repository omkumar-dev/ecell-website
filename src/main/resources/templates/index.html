<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Cell MIT | Innovating Futures</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans">

    <div th:replace="~{fragments :: navbar}"></div>

    <header id="home" class="bg-white py-20 px-4 border-b">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center">
            <div class="md:w-1/2 mb-10">
                <h1 class="text-5xl font-extrabold text-gray-900 leading-tight mb-6">
                    Fueling the <span class="text-blue-600">Entrepreneurs</span> of Tomorrow.
                </h1>
                <p class="text-lg text-gray-600 mb-8">The Entrepreneurship Cell at MIT is a platform for students to turn ideas into successful business ventures.</p>
                <a th:href="@{/events}" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold shadow-lg hover:bg-blue-700 transition">Explore Events</a>
            </div>
            <div class="md:w-1/2 flex justify-center">
                <i class="fas fa-lightbulb text-[120px] text-yellow-400 animate-pulse"></i>
            </div>
        </div>
    </header>

    <section id="team" class="py-20 bg-gray-100">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h2 class="text-4xl font-bold mb-12">Meet Our <span class="text-blue-600">Team</span></h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <div class="w-24 h-24 bg-blue-100 rounded-full mx-auto mb-4 flex items-center justify-center">
                        <i class="fas fa-user-tie text-4xl text-blue-600"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800">Om Kumar</h3>
                    <p class="text-blue-600 font-medium">Technical Head</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <div class="w-24 h-24 bg-blue-100 rounded-full mx-auto mb-4 flex items-center justify-center">
                        <i class="fas fa-users text-4xl text-blue-600"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800">E-Cell MIT</h3>
                    <p class="text-blue-600 font-medium">Core Committee</p>
                </div>
            </div>
            <div class="mt-10">
                <a th:href="@{/team}" class="text-blue-600 font-bold hover:underline">View Full Team →</a>
            </div>
        </div>
    </section>

    <div th:replace="~{fragments :: footer}"></div>

</body>
</html>
