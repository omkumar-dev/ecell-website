<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Core Login | Agri Start UP Today</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-900 flex items-center justify-center h-screen">

    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-green-800 mb-8">Core Member Login</h2>
        
        <p th:if="${error}" class="text-red-500 text-center mb-4" th:text="${error}"></p>

        <form action="/core-login" method="POST" class="space-y-6">
            <div>
                <label class="block text-gray-700 font-bold mb-2">Member ID</label>
                <input type="text" name="username" required class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-green-600">
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2">Access Key</label>
                <input type="password" name="password" required class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-green-600">
            </div>
            <button type="submit" class="w-full bg-green-700 text-white py-3 rounded-xl font-bold hover:bg-green-800 transition">Verify Identity</button>
        </form>
        <div class="mt-6 text-center">
            <a href="/" class="text-sm text-gray-500 hover:underline">← Back to Home</a>
        </div>
    </div>

</body>
</html>
