<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Core Member Login | Agri Start UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-green-900 flex items-center justify-center min-h-screen">

    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md border-t-8 border-yellow-400">
        <div class="text-center mb-8">
            <i class="fas fa-user-shield text-5xl text-green-700"></i>
            <h2 class="text-3xl font-black text-green-800 mt-4">CORE LOGIN</h2>
            <p class="text-gray-500 text-sm">Restricted Access for MIT E-Cell Members</p>
        </div>
        
        <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6 text-center">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/core-login}" method="POST" class="space-y-6">
            <div>
                <label class="block text-gray-700 font-bold mb-2">Member ID</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" name="username" required 
                           class="w-full pl-10 pr-4 py-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-green-600 border-gray-200"
                           placeholder="Enter admin ID">
                </div>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2">Access Key</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" name="password" required 
                           class="w-full pl-10 pr-4 py-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-green-600 border-gray-200"
                           placeholder="Enter password">
                </div>
            </div>
            <button type="submit" class="w-full bg-green-700 text-white py-4 rounded-xl font-black hover:bg-green-800 transition shadow-lg transform active:scale-95">
                VERIFY & ENTER
            </button>
        </form>
        
        <div class="mt-8 text-center">
            <a href="/" class="text-green-700 font-bold hover:underline">← Exit to Home</a>
        </div>
    </div>

</body>
</html>
