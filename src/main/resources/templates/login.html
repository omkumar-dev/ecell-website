<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Core Login | E-Cell MIT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-900 flex items-center justify-center min-h-screen">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md">
        <h2 class="text-3xl font-black text-center text-blue-800 mb-8">CORE ACCESS</h2>
        <div th:if="${error}" class="bg-red-100 text-red-700 p-3 rounded mb-6 text-center" th:text="${error}"></div>
        <form th:action="@{/core-login}" method="POST" class="space-y-6">
            <input type="text" name="username" placeholder="Member ID" required class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-600">
            <input type="password" name="password" placeholder="Access Key" required class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-600">
            <button type="submit" class="w-full bg-blue-700 text-white py-3 rounded-xl font-bold hover:bg-blue-800 shadow-lg">VERIFY & ENTER</button>
        </form>
    </div>
</body>
</html>
